[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A small GPT-style language model built from scratch"
readme = "README.md"
authors = [
    { name = "VictorMerk", email = "victor.merk@stud.uni-heidelberg.de" }
]
requires-python = ">=3.12"
dependencies = ["torch>=2.6"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
gpt-from-scratch-train = "gpt_from_scratch.train:main"
gpt-from-scratch-sample = "gpt_from_scratch.sample:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

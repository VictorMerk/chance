[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "A small GPT-style language model built from scratch"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "VictorMerk", email = "victor.merk@stud.uni-heidelberg.de" }
]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
]
dependencies = ["torch>=2.13.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx2>=2.0"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.urls]
Homepage = "https://github.com/VictorMerk/gpt-from-scratch"
Repository = "https://github.com/VictorMerk/gpt-from-scratch"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
gpt-from-scratch-train = "gpt_from_scratch.train:main"
gpt-from-scratch-sample = "gpt_from_scratch.sample:main"
gpt-from-scratch-evaluate = "gpt_from_scratch.evaluate:main"
gpt-from-scratch-benchmark = "gpt_from_scratch.benchmark:main"
gpt-from-scratch-plot = "gpt_from_scratch.plots:main"
gpt-from-scratch-sweep = "gpt_from_scratch.sweep:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src/gpt_from_scratch"]
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/gpt_from_scratch"]

[tool.coverage.report]
show_missing = true
